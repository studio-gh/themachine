<!DOCTYPE html>
<html lang="pt" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Machine | Hub Jarvis Performance</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { slate: { 950: '#020617', 900: '#0f172a' } } } } }
    </script>
    <style>
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
    <div id="root"></div>

    <script type=\"text/babel\">
        const { useState, useEffect } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [workouts, setWorkouts] = useState([
                { id: 1, week: 2, day: 'Terça-feira', title: 'Fartlek Suave (Z2/Z3)', target: '8km total (2km aquecimento + 4x 1km forte / 1km trotando)', status: 'Pendente' },
                { id: 2, week: 2, day: 'Quarta-feira', title: 'Futebol / Substituição', target: '3 partidas intensas de 15 min cada', status: 'Concluído' },
                { id: 3, week: 2, day: 'Quinta-feira', title: 'Corrida Contínua Leve', target: '6km em Z1/Z2 (Pace 5:45 - 6:00)', status: 'Pendente' },
                { id: 4, week: 2, day: 'Sábado', title: 'Treino Longo Aeróbico', target: '12km em Z1 (Foco em construção de base)', status: 'Pendente' }
            ]);

            const [history, setHistory] = useState([
                { id: 101, date: '15/07/2026', type: 'Corrida Fartlek', distance: '8.2 km', duration: '46 min', pace: '5:36 /km', calories: '580 kcal' }
            ]);

            const clearHistory = () => {
                if (confirm('Deseja limpar todo o histórico e dados em cache?')) {
                    localStorage.clear();
                    setHistory([]);
                }
            };

            return (
                <div className="max-w-4xl mx-auto pb-24 px-4 pt-6">
                    <header className="mb-6 flex justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800">
                        <div>
                            <h1 className="text-xl font-bold text-emerald-400">⚡ The Machine | Jarvis Performance</h1>
                            <p className="text-xs text-slate-400">Plano Rumo à Meia Maratona | Semana 2 de 38</p>
                        </div>
                        <button onClick={clearHistory} className="bg-rose-900/40 text-rose-300 px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-rose-900/60 border border-rose-800">
                            🗑️ Limpar Cache
                        </button>
                    </header>

                    <nav className="flex space-x-2 mb-6 border-b border-slate-800 pb-2 overflow-x-auto scrollbar-none">
                        <button onClick={() => setActiveTab('dashboard')} className={`px-4 py-2 rounded-lg text-sm font-medium ${activeTab === 'dashboard' ? 'bg-emerald-600 text-white' : 'bg-slate-900 text-slate-300'}`}>
                            📊 Planilha & Treinos
                        </button>
                        <button onClick={() => setActiveTab('sync')} className={`px-4 py-2 rounded-lg text-sm font-medium ${activeTab === 'sync' ? 'bg-emerald-600 text-white' : 'bg-slate-900 text-slate-300'}`}>
                            ⌚ Ecossistema & Dispositivos
                        </button>
                    </nav>

                    <main>
                        {activeTab === 'dashboard' && (
                            <div className="space-y-4">
                                <h2 className="text-lg font-semibold text-slate-200">Sessões da Semana Atual</h2>
                                {workouts.map((w) => (
                                    <div key={w.id} className="bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                        <div>
                                            <span className="text-xs font-bold text-emerald-400 uppercase tracking-wider">{w.day}</span>
                                            <h3 className="text-md font-semibold text-white">{w.title}</h3>
                                            <p className="text-xs text-slate-400 mt-1">{w.target}</p>
                                        </div>
                                        <div className="flex items-center gap-3">
                                            <span className={`px-2.5 py-1 rounded text-xs font-medium ${w.status === 'Concluído' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-amber-950 text-amber-400 border border-amber-800'}`}>
                                                {w.status}
                                            </span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'sync' && (
                            <div className="bg-slate-900 p-6 rounded-xl border border-slate-800 space-y-4">
                                <h2 className="text-lg font-semibold text-white">Integração de Dispositivos & Saúde</h2>
                                <p className="text-sm text-slate-400">Estado das conexões com o seu ecossistema físico e contas de desporto:</p>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                                    <div className="p-4 bg-slate-950 rounded-lg border border-slate-800 flex justify-between items-center">
                                        <div>
                                            <h4 className="font-semibold text-sm text-slate-200">Galaxy Watch 4</h4>
                                            <p className="text-xs text-slate-400">Health Connect (Frequência Cardíaca)</p>
                                        </div>
                                        <span className="text-xs bg-emerald-900 text-emerald-300 px-2 py-1 rounded">Pronto</span>
                                    </div>
                                    <div className="p-4 bg-slate-950 rounded-lg border border-slate-800 flex justify-between items-center">
                                        <div>
                                            <h4 className="font-semibold text-sm text-slate-200">Strava API</h4>
                                            <p className="text-xs text-slate-400">Sincronização de Atividades</p>
                                        </div>
                                        <span className="text-xs bg-emerald-900 text-emerald-300 px-2 py-1 rounded">Conectado</span>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 py-3 px-6 z-40">
                        <div className="max-w-md mx-auto flex justify-around">
                            <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center space-y-1 ${activeTab === 'dashboard' ? 'text-emerald-400' : 'text-slate-400'}`}>
                                <span className="text-lg">📊</span>
                                <span className="text-[10px] font-medium">Planilha</span>
                            </button>
                            <button onClick={() => setActiveTab('sync')} className={`flex flex-col items-center space-y-1 ${activeTab === 'sync' ? 'text-emerald-400' : 'text-slate-400'}`}>
                                <span className="text-lg">⌚</span>
                                <span className="text-[10px] font-medium">Ecossistema</span>
                            </button>
                        </div>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
