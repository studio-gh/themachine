<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planilha Meia Maratona Rio</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        // Extração dos hooks do objeto React global
        const { useState, useEffect } = React;

        function App() {
            const [currentWeek, setCurrentWeek] = useState(1);
            const [userWeight, setUserWeight] = useState(70);
            const [activeTab, setActiveTab] = useState('dashboard');
            
            const getWorkouts = (wk) => [
                { id: 1, day: 'Segunda', type: 'Yoga + Kettlebell', duration: '40 min', completed: false, isRun: false },
                { id: 2, day: 'Terça', type: `Corrida Fartlek (S${wk})`, duration: '50 min', completed: false, isRun: true },
                { id: 3, day: 'Quarta', type: 'Yoga + Kettlebell', duration: '40 min', completed: false, isRun: false },
                { id: 4, day: 'Quinta', type: 'Corrida Z2', duration: '50 min', completed: false, isRun: true },
                { id: 5, day: 'Sexta', type: 'Yoga + Kettlebell', duration: '40 min', completed: false, isRun: false },
                { id: 6, day: 'Fim de Sem.', type: `Longo (~${(8 + wk * 0.8).toFixed(1)} km)`, duration: '80 min', completed: false, isRun: true }
            ];

            const [workouts, setWorkouts] = useState(getWorkouts(1));
            useEffect(() => setWorkouts(getWorkouts(currentWeek)), [currentWeek]);

            return (
                <div className="p-4 max-w-lg mx-auto">
                    <h1 className="text-xl font-bold text-emerald-400 mb-4">Meia Maratona: Sem {currentWeek}</h1>
                    <div className="flex gap-2 overflow-x-auto pb-4">
                        {Array.from({length: 16}, (_, i) => i + 1).map(wk => (
                            <button key={wk} onClick={() => setCurrentWeek(wk)} className={`px-4 py-2 rounded ${currentWeek === wk ? 'bg-emerald-600' : 'bg-slate-800'}`}>{wk}</button>
                        ))}
                    </div>
                    {workouts.map(w => (
                        <div key={w.id} className="bg-slate-900 p-4 rounded mb-2 border border-slate-700">
                            <p className="font-bold">{w.day}: {w.type}</p>
                        </div>
                    ))}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
