<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Machine | Performance Hub</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { slate: { 950: '#020617', 900: '#0f172a' } } } } }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [currentWeek, setCurrentWeek] = useState(1);
            const [activeTab, setActiveTab] = useState('dashboard');
            
            // Lógica de Planilha e Estados (Versão Premium Integrada)
            const getWorkouts = (wk) => [
                { id: 1, day: 'Segunda', type: 'Yoga + Kettlebell', desc: 'Mobilidade & Força', color: 'text-emerald-400' },
                { id: 2, day: 'Terça', type: 'Corrida Fartlek', desc: `Progressão Semana ${wk}`, color: 'text-cyan-400' },
                { id: 3, day: 'Quarta', type: 'Yoga + Kettlebell', desc: 'Fortalecimento Funcional', color: 'text-emerald-400' },
                { id: 4, day: 'Quinta', type: 'Corrida Moderada Z2', desc: 'Volume de Base', color: 'text-cyan-400' },
                { id: 5, day: 'Sexta', type: 'Yoga + Kettlebell', desc: 'Core & Regeneração', color: 'text-emerald-400' },
                { id: 6, day: 'Fim de Sem.', type: 'Longo Progressivo', desc: `Meta Meia Maratona ${wk > 20 ? 'Rio 2027' : '15k 2026'}`, color: 'text-amber-400' }
            ];

            return (
                <div className="p-4 max-w-lg mx-auto pb-24">
                    <header className="mb-8">
                        <h1 className="text-2xl font-black italic tracking-tighter text-white">THE MACHINE <span className="text-emerald-500">v1.0</span></h1>
                        <p className="text-slate-500 text-xs font-mono">ESTADO: PRONTO PARA MISSÃO</p>
                    </header>

                    <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl mb-6">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="font-bold text-lg">Plano de 38 Semanas</h2>
                            <span className="bg-emerald-950 text-emerald-400 px-3 py-1 rounded-full text-xs font-bold">SEM {currentWeek}</span>
                        </div>
                        <div className="flex gap-2 overflow-x-auto scrollbar-none pb-2">
                            {[...Array(38)].map((_, i) => (
                                <button key={i} onClick={() => setCurrentWeek(i+1)} className={`w-10 h-10 rounded-full flex items-center justify-center font-bold text-xs ${currentWeek === i+1 ? 'bg-emerald-500 text-white' : 'bg-slate-800'}`}>
                                    {i+1}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="space-y-3">
                        {getWorkouts(currentWeek).map(w => (
                            <div key={w.id} className="bg-slate-900/50 border border-slate-800 p-4 rounded-2xl flex items-center justify-between hover:border-slate-600 transition">
                                <div>
                                    <p className={`text-[10px] font-black uppercase ${w.color}`}>{w.day}</p>
                                    <p className="font-bold text-sm">{w.type}</p>
                                    <p className="text-slate-500 text-xs">{w.desc}</p>
                                </div>
                                <div className="w-8 h-8 rounded-full border-2 border-slate-700 flex items-center justify-center cursor-pointer hover:bg-emerald-900">✓</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
